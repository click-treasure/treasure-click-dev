<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黄金島｜CLICK TREASURE</title>
<link rel="stylesheet" href="./style.css?v=88-40">
<style>
body.golden-page{min-height:100vh}
.golden-page-wrap{width:min(1180px,calc(100% - 24px));margin:24px auto 42px}
.golden-page .golden-game{display:block!important;margin:0}
.golden-page .golden-map{
  /* V88-35: fit all 50 chests safely inside the perspective floor */
  padding:28% 18% 12%!important;
  gap:5px!important;
  background-position:center center!important;
}
.golden-page .golden-chest img{width:78%;height:78%}
@media(max-width:650px){
  .golden-page-wrap{width:calc(100% - 12px);margin:8px auto 24px}
  .golden-page .golden-map{padding:28% 13% 12%!important;gap:2px!important}
  .golden-page .golden-chest img{width:86%;height:86%}
}
</style>
</head>
<body class="golden-page">
<div id="fx"></div>
<div id="jackpotOverlay" class="jackpot-overlay" aria-hidden="true">
  <div class="jackpot-rays"></div>
  <div class="jackpot-card">
    <div id="jackpotLabel" class="jackpot-label">✨ 黄金大当たり！！ ✨</div>
    <div class="jackpot-caption">獲得ポイント</div>
    <div class="jackpot-money"><span id="jackpotAmount">100</span><small>P</small></div>
    <div id="jackpotBang" class="jackpot-bang">！！！</div>
  </div>
</div>
<audio id="audio1old" preload="auto" src="sounds/win_1.wav"></audio>
<audio id="audio10old" preload="auto" src="sounds/win_10.wav"></audio>
<audio id="audio100old" preload="auto" src="sounds/win_100.wav"></audio>

<main class="golden-page-wrap">
<section id="goldenGame" class="golden-game">
  <div class="golden-hero">
    <div class="golden-hero-shade"></div>
    <div class="golden-head">
      <div>
        <span>SECRET TREASURE ISLAND</span>
        <h2>✨ 黄金島 ✨</h2>
        <p>天空に眠る50個の神聖な宝箱。1つ選べば100P以上確定。</p>
      </div>
      <button id="goldenBack" type="button" onclick="location.href='./index.html'">← 島一覧</button>
    </div>
    <div class="golden-ticket-status">🎫 所持チケット <strong id="goldenTicketsInGame">0</strong>枚</div>
  </div>
  <div class="golden-map-head">
    <div><small>TREASURE MAP</small><b>👑 黄金の宝箱</b></div>
    <span>50 CHESTS / GUARANTEED WIN</span>
  </div>
  <div id="goldenMap" class="golden-map"></div>
  <div id="goldenMessage" class="golden-message">黄金の宝箱を1つ選ぼう</div>
</section>
  <section class="ad island-ad" aria-label="広告">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/87367a901842c04cb35344ce335b7de3"></script>
    <!-- admax -->
  </section>
</main>
<script src="./ct-analytics.js?v=1"></script>
